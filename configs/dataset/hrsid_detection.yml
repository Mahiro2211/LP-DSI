task: detection

evaluator:
  type: CocoEvaluator
  iou_types: ['bbox', ]

num_classes: 1 # ship
remap_mscoco_category: False

train_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetection
    img_folder: /root/autodl-tmp/Dataset/HRSID_JPG/HRSID_JPG/JPEGImages
    ann_file: /root/autodl-tmp/Dataset/HRSID_JPG/HRSID_JPG/annotations/train2017_contiguous.json
    return_masks: False
    transforms:
      type: Compose
      ops: ~
  shuffle: True
  num_workers: 4
  drop_last: True
  collate_fn:
    type: BatchImageCollateFunction


val_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetection
    img_folder: /root/autodl-tmp/Dataset/HRSID_JPG/HRSID_JPG/JPEGImages
    ann_file: /root/autodl-tmp/Dataset/HRSID_JPG/HRSID_JPG/annotations/test2017_contiguous.json
    return_masks: False
    transforms:
      type: Compose
      ops: ~
  shuffle: False
  num_workers: 4
  drop_last: False
  collate_fn:
    type: BatchImageCollateFunction
